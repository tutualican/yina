name: Bug report
description: Report something that does not work
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** attach personal deck content
        (notes, images, audio) or a full collection file.
  - type: input
    id: version
    attributes:
      label: Version
      description: The version shown in Yina's About dialog, or the APK filename.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / Android version
      placeholder: "Pixel 6, Android 14"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: If possible, include `adb logcat` output or a screenshot.
    validations:
      required: false
