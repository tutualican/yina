name: Release

# Signing keys stay local by default. Run this workflow manually after adding
# the four signing secrets to the repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name, without the leading v
        required: true
        default: "0.2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version
        id: version
        run: |
          NAME="${{ inputs.version }}"
          CODE="$(echo "$NAME" | awk -F. '{printf "%d%02d%02d", $1, $2, $3}')"
          if [ -z "$CODE" ] || [ "$CODE" = "000" ]; then CODE="${{ github.run_number }}"; fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      # Requires repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is missing. See README.md#release-signing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APKs
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Rename artifacts
        run: |
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            base="$(basename "$apk" .apk)"
            abi="${base#app-}"
            abi="${abi%-release}"
            cp "$apk" "dist/yina-${{ steps.version.outputs.name }}-${abi}.apk"
          done
          ls -lh dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Yina ${{ steps.version.outputs.name }}
          tag_name: v${{ steps.version.outputs.name }}
          generate_release_notes: true
          draft: false
          files: |
            dist/*.apk

      - name: Clean up signing material
        if: always()
        run: rm -f release.jks keystore.properties
